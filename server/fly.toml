app = "ctrlpoint-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  ENABLE_DEPLOY_WORKER = "true"
  DEPLOY_WORKER_STATIC_CONCURRENCY = "3"
  DEPLOY_WORKER_FRAMEWORK_CONCURRENCY = "1"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

